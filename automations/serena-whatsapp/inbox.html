<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07388E">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Inbox Serena">
<link rel="apple-touch-icon" href="https://cdn.shopify.com/s/files/1/0643/9000/4908/t/26/assets/serena-inbox-192.png?v=1788404432"><link rel="icon" href="https://cdn.shopify.com/s/files/1/0643/9000/4908/t/26/assets/serena-inbox-192.png?v=1788404432">
<title>Inbox Serena</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#07388E;--azul2:#1554c7;--azul-l:#e8effc;--verm:#AD0404;--verde:#15803d;--verde-l:#e7f7ec;--amb:#b45309;--amb-l:#fff4dc;--bg:#f3f5f9;--card:#fff;--bd:#e5e8ef;--tx:#151a24;--tx2:#4b5563;--fr:#8a93a3;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 20px -8px rgba(16,24,40,.12);--r:14px}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:13.5px;color:var(--tx)}
a{color:var(--azul2)}
svg{width:16px;height:16px;flex-shrink:0;vertical-align:-3px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cfd5e0;border-radius:9px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* topo */
.top{background:linear-gradient(90deg,#062c73,#07388E 55%,#0d47b0);color:#fff;padding:0 18px;height:58px;display:flex;align-items:center;gap:16px;flex-shrink:0;box-shadow:0 2px 12px rgba(7,56,142,.25);z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logo{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.6px}
.logo i{font-style:normal;border-bottom:3px solid #fff;opacity:.9}
.brand .sub{font-size:12.5px;opacity:.8;font-weight:500}
.kpis{margin-left:auto;display:flex;gap:6px}
.kpi{padding:5px 11px;border-radius:10px;background:rgba(255,255,255,.1);text-align:center;min-width:64px}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;line-height:1}
.kpi span{opacity:.75;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-top:2px}
.kpi.warn{background:rgba(255,210,120,.22)}
.actions{display:flex;gap:8px;align-items:center}
.ghost{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;font-weight:600;transition:.15s}
.ghost:hover{background:rgba(255,255,255,.22)}
.ghost .av{width:22px;height:22px;font-size:10px}

/* layout */
.wrap{flex:1;display:flex;min-height:0}
.lista{width:340px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.filtros{padding:12px 12px 8px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:9px;background:#fff}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid transparent;border-radius:11px;padding:0 11px}
.search svg{color:var(--fr)}
.search input{flex:1;border:0;background:transparent;padding:10px 0;outline:none}
.search:focus-within{border-color:var(--azul2);background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--tx2);background:var(--bg);transition:.15s}
.chips button.on{background:var(--azul);color:#fff}
.chips button .n{display:inline-block;margin-left:5px;font-size:10px;background:rgba(0,0,0,.12);padding:1px 6px;border-radius:10px}
.lin{display:flex;gap:8px;align-items:center}
.lin select{flex:1;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-size:12.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);white-space:nowrap}
#convs{flex:1;overflow-y:auto;padding:6px}
.cv{display:flex;gap:11px;padding:11px 10px;border-radius:12px;cursor:pointer;position:relative;transition:.12s}
.cv:hover{background:#f6f8fc}
.cv.on{background:var(--azul-l)}
.cv .col{flex:1;min-width:0}
.cv .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cv .n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.unread .n{font-weight:700}
.cv .h{font-size:11px;color:var(--fr);white-space:nowrap}
.cv.unread .h{color:var(--azul2);font-weight:600}
.cv .p{font-size:12.5px;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv.unread .p{color:var(--tx)}
.cv .tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.cv .dot{position:absolute;right:12px;bottom:14px;width:9px;height:9px;border-radius:50%;background:var(--azul2);box-shadow:0 0 0 3px var(--azul-l)}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;letter-spacing:.3px;position:relative}
.av.sm{width:30px;height:30px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:19px}
.av .ch{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.av .ch svg{width:9px;height:9px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;vertical-align:middle;line-height:1.5}
.pw{background:#dcfce7;color:#166534}.ps{background:#dbe7ff;color:#1e40af}.pi{background:#fce7f3;color:#9d174d}.pt{background:#e0f2fe;color:#075985}.pp{background:#fef3c7;color:#92400e}.pe{background:#fee2e2;color:#991b1b}.pg{background:#eef0f4;color:#374151}.pk{background:#ede9fe;color:#5b21b6}
.esp{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--amb);font-weight:700}
.esp.crit{color:var(--verm)}

/* chat */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#eef1f6;background-image:radial-gradient(rgba(7,56,142,.05) 1px,transparent 1px);background-size:22px 22px}
.chat-head{padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0;min-height:62px}
.chat-head .info{flex:1;min-width:0}
.chat-head .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center;font-size:12px;color:var(--fr)}
.chat-head .acts{display:flex;gap:6px}
.ib{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--tx2);transition:.15s;white-space:nowrap}
.ib:hover{background:#e6eaf2;color:var(--tx)}
.ib.pri{background:var(--azul);color:#fff}.ib.pri:hover{background:var(--azul2)}
.ib.ok{background:var(--verde-l);color:var(--verde)}
.ib.dng{background:#fee2e2;color:var(--verm)}
.ib.back,.ib.fichabt{display:none}
#thread{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:8px}
.m{max-width:68%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(16,24,40,.06);position:relative}
.mc{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
.ms{align-self:flex-end;background:linear-gradient(135deg,#0b43a8,#07388E);color:#fff;border-bottom-right-radius:5px}
.mh{align-self:flex-end;background:linear-gradient(135deg,#1a9a4a,#15803d);color:#fff;border-bottom-right-radius:5px}
.msis{align-self:center;background:#e4e8f0;color:var(--tx2);font-size:12px;max-width:80%;border-radius:10px;padding:6px 12px}
.m .hora{font-size:10.5px;opacity:.65;margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m .corr{cursor:pointer;text-decoration:underline;opacity:.9}
.m.ms .corr:hover{opacity:1}
.sep{align-self:center;font-size:10.5px;font-weight:600;color:var(--tx2);background:#fff;padding:3px 12px;border-radius:20px;margin:6px 0;box-shadow:0 1px 1px rgba(16,24,40,.06)}
.empty{margin:auto;text-align:center;color:var(--fr);font-size:13.5px;line-height:1.7;max-width:320px}
.empty .ico{width:64px;height:64px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:var(--sh)}
.empty .ico svg{width:28px;height:28px;color:var(--azul)}
#comp{background:#fff;border-top:1px solid var(--bd);padding:10px 16px 12px;flex-shrink:0}
#comp.off{display:none}
.aviso{font-size:12.5px;color:var(--amb);background:var(--amb-l);border:1px solid #fde4a8;padding:7px 11px;border-radius:10px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.aviso.red{color:var(--verm);background:#fee2e2;border-color:#fecaca}
.aviso a{cursor:pointer;font-weight:700;white-space:nowrap}
.crow{display:flex;gap:9px;align-items:flex-end;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:6px 6px 6px 14px}
.crow:focus-within{border-color:var(--azul2);background:#fff}
#resp{flex:1;padding:8px 0;border:0;background:transparent;font-size:14px;resize:none;max-height:140px;line-height:1.45;outline:none}
#btenv{width:40px;height:40px;border-radius:11px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s}
#btenv:hover{background:var(--azul2)}#btenv:disabled{opacity:.5}
#btenv svg{width:18px;height:18px}
.dica{font-size:10.5px;color:var(--fr);margin-top:6px}

/* ficha */
.ficha{width:380px;background:var(--card);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 8px;flex-shrink:0;background:#fff}
.tabs button{flex:1;padding:13px 4px 11px;font-size:12.5px;font-weight:600;color:var(--fr);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--azul);border-color:var(--azul)}
.ficha-body{flex:1;overflow-y:auto;padding:14px 16px 24px}
.pane{display:none}.pane.on{display:block}
.hero{display:flex;gap:12px;align-items:center;padding:4px 0 14px}
.hero .nm{font-weight:700;font-size:16px}
.hero .sub{font-size:12.5px;color:var(--tx2);margin-top:2px;word-break:break-all}
.hero .chips{margin-top:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--bg);border-radius:12px;padding:9px 10px;text-align:center}
.st b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;color:var(--azul);line-height:1}
.st span{font-size:10px;color:var(--fr);text-transform:uppercase;letter-spacing:.5px}
.sec{margin-top:16px}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--fr);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.sec h3 a{font-size:11px;letter-spacing:0;text-transform:none;font-weight:600;text-decoration:none;cursor:pointer}
.card{border:1px solid var(--bd);border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.55;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card+.card{margin-top:8px}
.card.ok{border-color:#bbf7d0;background:#f0fdf4}.card.warn{border-color:#fde68a;background:#fffbeb}.card.bad{border-color:#fecaca;background:#fef2f2}.card.info{border-color:#c7d7fb;background:#f3f7ff}
.card small{color:var(--fr);font-size:11px}
.cmp{font-size:12.5px;padding:6px 0;border-bottom:1px solid #f1f3f7;display:flex;justify-content:space-between;gap:10px}
.cmp:last-child{border-bottom:0}
.cmp b{color:var(--fr);font-weight:500;flex-shrink:0}
.cmp span{text-align:right;word-break:break-word}
.ped{padding:9px 0;border-bottom:1px solid #f1f3f7;font-size:12.5px}
.ped:last-child{border-bottom:0}
.ped .pt2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ped .pt2 b a{color:var(--azul2);text-decoration:none}
.ped .pt2 span{color:var(--fr);font-size:11px;white-space:nowrap}
.ped .st2{color:var(--tx2);margin-top:2px}
.ped .it{color:var(--fr);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nada{font-size:12.5px;color:var(--fr);padding:6px 0}
.btn{width:100%;padding:10px;border-radius:11px;font-size:13px;font-weight:600;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.b1{background:var(--azul);color:#fff}.b1:hover{background:var(--azul2)}
.b2{background:#fff;color:var(--azul);border:1px solid #c7d7fb}.b2:hover{background:var(--azul-l)}
.b3{background:#fff;color:var(--verm);border:1px solid #fecaca}.b3:hover{background:#fef2f2}
.b4{background:#fff;color:var(--tx2);border:1px solid var(--bd)}.b4:hover{background:var(--bg)}
.bok{background:var(--verde);color:#fff}.bok:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nota{font-size:12.5px;padding:8px 10px;border:1px solid #fde68a;background:#fffbeb;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;line-height:1.5}
.nota a{color:var(--verm);cursor:pointer;font-weight:700;text-decoration:none}
.ficha textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:11px;font-size:12.5px;resize:vertical;min-height:58px;margin-top:6px;outline:none}
.ficha textarea:focus,.ficha select:focus{border-color:var(--azul2)}
.ficha select{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:11px;font-size:12.5px;margin-top:6px;background:#fff;outline:none}
.stars{color:#f59e0b;letter-spacing:1px}
.dis{font-size:11.5px;padding:6px 0;border-bottom:1px solid #f1f3f7;display:flex;justify-content:space-between;gap:6px}
.dis:last-child{border-bottom:0}
.dis span{color:var(--fr);white-space:nowrap;text-align:right}
.corrbox{border-left:3px solid #fbbf24;padding:6px 10px;margin:6px 0;font-size:12.5px;background:#fffdf5;border-radius:0 10px 10px 0}
.corrbox .old{text-decoration:line-through;color:var(--fr)}
.corrbox .new{margin-top:2px}
.corrbox small{color:var(--fr)}
.agv{display:flex;align-items:center;gap:8px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,18,40,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;width:min(900px,96vw);max-height:92vh;overflow:auto;padding:20px 22px;font-size:13px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.mbox.sm{width:min(520px,96vw)}
.mbox h2{font-family:"Barlow Condensed",sans-serif;font-size:26px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mbox h2 .x{font-family:Inter,sans-serif;font-size:13px;cursor:pointer;color:var(--fr);font-weight:600}
.mbox h4{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--fr);margin:16px 0 8px;font-weight:700}
.mbox textarea,.mbox input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;font-size:13.5px;outline:none;margin-top:6px}
.mbox textarea:focus,.mbox input:focus{border-color:var(--azul2)}
.mbox .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.mbox .row .btn{width:auto;padding:9px 16px;margin:0}
.per{font-size:12.5px;display:flex;gap:4px}
.per a{padding:4px 9px;border-radius:8px;cursor:pointer;color:var(--tx2);font-weight:500;text-decoration:none}
.per a.on{background:var(--azul-l);color:var(--azul);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:10px 0}
.kb{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:#fff}
.kb b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:26px;line-height:1.05;color:var(--azul)}
.kb span{font-size:10.5px;color:var(--fr);text-transform:uppercase;letter-spacing:.5px}
.kb.g b{color:var(--verde)}.kb.a b{color:var(--amb)}
.bar{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--tx2);margin:4px 0}
.bar i{display:inline-block;height:9px;background:linear-gradient(90deg,var(--azul),#4f83e6);border-radius:5px;font-style:normal;min-width:3px}
.bar .d{width:66px;color:var(--fr)}
.quote{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--tx2);white-space:pre-wrap;max-height:130px;overflow:auto}
.namechips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.namechips button{padding:6px 12px;border-radius:20px;background:var(--azul-l);color:var(--azul);font-weight:600;font-size:12.5px}
.pop{position:absolute;left:14px;right:14px;bottom:100%;margin-bottom:8px;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 16px 40px -12px rgba(16,24,40,.35);max-height:300px;overflow:auto;display:none;z-index:20}
.pop.on{display:block}
.pop .it{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f3f7;display:flex;gap:10px;align-items:baseline}
.pop .it:hover,.pop .it.sel{background:var(--azul-l)}
.pop .it b{color:var(--azul);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.pop .it span{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pop .ft{padding:8px 14px;font-size:11.5px;color:var(--fr);display:flex;justify-content:space-between}
.pop .ft a{cursor:pointer;font-weight:600}
#comp{position:relative}
.btpr{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--azul);background:var(--azul-l);flex-shrink:0;font-size:16px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#3730a3;font-weight:600}
.tag i{font-style:normal;cursor:pointer;opacity:.6;font-size:12px}.tag i:hover{opacity:1}
.tag.add{background:var(--bg);color:var(--fr);cursor:pointer;border:1px dashed var(--bd)}
.tagmenu{position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 16px 40px -12px rgba(16,24,40,.35);padding:8px;z-index:30;display:none;min-width:220px}
.tagmenu.on{display:block}
.tagmenu button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:12.5px}
.tagmenu button:hover{background:var(--azul-l)}
.tagmenu input{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;font-size:12.5px}
.tagwrap{position:relative;display:inline-block}
.prlist .ln{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid #f1f3f7}
.prlist .ln b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--azul);font-size:12.5px}
.prlist .ln p{font-size:12.5px;color:var(--tx2);white-space:pre-wrap}
.prlist .ln a{cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.prlist .ln a.del{color:var(--verm);margin-left:8px}

<script>

}).catch(function(e){box.innerHTML='<div class="empty" style="margin-top:50px;color:#AD0404;font-size:12.5px">Erro: '+esc(e.message)+'<br>Confira o token na URL.</div>';});}

/* thread */

function abrir(id){sel=id;ultima=null;fichaAtual=null;if(isMobile())document.body.className='m-chat';carregarConvs();var th=document.getElementById('thread');th.innerHTML='<div class="empty">Carregando…</div>';

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function b64uToU8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var pad='='.repeat((4-s.length%4)%4);var raw=atob(s+pad);var a=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a;}
function estadoPush(){var b=document.getElementById('btpush'),t=document.getElementById('pushtxt');if(!('Notification' in window)||!('serviceWorker' in navigator)){b.style.display='none';return;}if(Notification.permission==='granted'&&localStorage.getItem('an_push')==='1'){b.className='ghost on';t.textContent=' Notificações ativas';}else{b.className='ghost';t.textContent=' Notificações';}}
function ativarPush(){if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('Este navegador não suporta notificações. No iPhone: Compartilhar → Adicionar à Tela de Início, e abra pelo ícone.',1);return;}
if(/iPhone|iPad/.test(navigator.userAgent)&&!isStandalone()){toast('No iPhone as notificações só funcionam com o app instalado: toque em Compartilhar → Adicionar à Tela de Início e abra pelo ícone.',1);return;}
if(!VAPID){toast('Servidor de notificações ainda não configurado.',1);return;}

Notification.requestPermission().then(function(perm){if(perm!=='granted'){toast('Permissão negada. Libere as notificações nos ajustes do navegador.',1);return;}
return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(VAPID)});}).then(function(sub){var j=sub.toJSON();return api({acao:'push_sub',endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,agente:AGENTE,ua:navigator.userAgent.slice(0,180)});}).then(function(){localStorage.setItem('an_push','1');estadoPush();toast('Notificações ativadas neste aparelho para '+AGENTE);});}).catch(function(e){toast('Falha ao ativar: '+e.message,1);});}
function alertaFila(n){if(filaAnt===null){filaAnt=n;return;}if(n>filaAnt){toast('🙋 Novo cliente aguardando atendente ('+n+' na fila)');try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){}try{var ac=new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();setTimeout(function(){o.stop();ac.close();},220);}catch(e){}}filaAnt=n;document.title=(n>0?'('+n+') ':'')+'Inbox Serena';}

function apagarNota(id,ch){if(!confirm('Apagar esta nota?'))return;api({acao:'nota',contato_id:id,chave:ch,texto:''}).then(function(){toast('Nota apagada');fichaDe(id,true);}).catch(function(e){toast('Erro: '+e.message,1);});}
function corrigir(id){var el=document.querySelector('[data-id="'+id+'"]');var orig=el?el.childNodes[0].textContent:'';
abrirModal('<h2>Corrigir a Serena <span class="x" onclick="fecharModal()">fechar</span></h2><h4>Ela respondeu</h4><div class="quote">'+esc(orig)+'</div><h4>Como deveria ter respondido</h4><textarea id="corrtxt" rows="5" placeholder="Escreva a resposta correta. A Serena passa a seguir essa correção nas próximas conversas."></textarea><label class="chk" style="margin-top:10px"><input type="checkbox" id="correnv" checked> Enviar esta resposta corrigida ao cliente agora, como minha mensagem</label><div class="row"><button class="btn b4" onclick="fecharModal()">Cancelar</button><button class="btn b1" onclick="enviarCorrecao(\''+id+'\')">Registrar correção</button></div>',true);setTimeout(function(){document.getElementById('corrtxt').focus();},50);}
function enviarCorrecao(id){var txt=document.getElementById('corrtxt').value.trim();if(!txt)return;var env=document.getElementById('correnv').checked;if(!AGENTE){fecharModal();pedirAgente();return;}
api({acao:'corrigir',contato_id:sel,mensagem_id:id,correcao:txt,autor:AGENTE,enviar:env}).then(function(){fecharModal();toast(env?'Correção registrada e enviada ao cliente':'Correção registrada');var el=document.querySelector('[data-id="'+id+'"] .corr');if(el)el.textContent='corrigida ✓';fichaCache={};if(env)novas();}).catch(function(e){toast('Erro: '+e.message,1);});}
function enviarAgente(){var ta=document.getElementById('resp'),bt=document.getElementById('btenv');var txt=ta.value.trim();if(!txt||!sel)return;if(!AGENTE){pedirAgente();return;}
bt.disabled=true;ta.disabled=true;
api({acao:'enviar',contato_id:sel,texto:txt,autor:AGENTE,canal:selCanal}).then(function(r){ta.value='';ta.style.height='auto';var th=document.getElementById('thread');th.insertAdjacentHTML('beforeend',bolha({id:r.dados.id,papel:'humano',texto:txt,autor:AGENTE,entregue:r.dados.entregue,criado_em:r.dados.criado_em,canal:r.dados.canal}));th.scrollTop=th.scrollHeight;ultima=r.dados.criado_em;if(r.aviso)toast(r.aviso,1);fichaDe(sel,true);carregarConvs();}).catch(function(e){toast('Falha ao enviar: '+e.message,1);}).then(function(){bt.disabled=false;ta.disabled=false;ta.focus();});}
function novas(){if(!sel||!ultima)return;api({acao:'novas',contato_id:sel,desde:ultima}).then(function(r){if(r.dados&&r.dados.length){var th=document.getElementById('thread');var perto=(th.scrollHeight-th.scrollTop-th.clientHeight)<120;r.dados.forEach(function(m){if(!th.querySelector('[data-id="'+m.id+'"]'))th.insertAdjacentHTML('beforeend',bolha(m));ultima=m.criado_em;});if(perto)th.scrollTop=th.scrollHeight;}}).catch(function(){});}

/* modal + metricas */
function abrirModal(html,sm){var m=document.getElementById('modal'),b=document.getElementById('mbox');b.className='mbox'+(sm?' sm':'');b.innerHTML=html;m.className='modal on';}
function fecharModal(){document.getElementById('modal').className='modal';}
function abrirMetricas(dias){dias=dias||7;abrirModal('<h2>Métricas da Serena <span class="x" onclick="fecharModal()">fechar</span></h2><div class="empty" style="padding:40px">Calculando (inclui vendas na Shopify)…</div>');
api({acao:'metricas',dias:dias}).then(function(r){var d=r.dados;var v=d.vendas_atribuidas||{};var fmt=function(s){return s==null?'-':(s>=60?Math.round(s/60)+' min':s+' s');};
var h='<h2>Métricas da Serena <span class="per">'+[7,30,90].map(function(x){return '<a onclick="abrirMetricas('+x+')" class="'+(x===dias?'on':'')+'">'+x+' dias</a>';}).join('')+'</span><span class="x" onclick="fecharModal()">fechar</span></h2>';
h+='<div class="grid">'+[['Conversas',d.conversas,''],['Autonomia',d.autonomia_pct!=null?d.autonomia_pct+'%':'-','g'],['Msgs da Serena',d.msgs_serena,''],['Msgs humanas',d.msgs_humano,''],['Handoffs',d.handoffs,'a'],['Fila aberta',d.fila_aberta,'a'],['Resposta média',fmt(d.resposta_media_seg),''],['Resposta mediana',fmt(d.resposta_mediana_seg),''],['Links de pagamento',d.links_pagamento,''],['Vendas atribuídas',v.n!=null?v.n+' · R$ '+num(v.total):'-','g'],['Transacionais',d.transacionais,''],['Pós-entrega',d.pos_entrega,''],['Correções',d.correcoes,''],['Áudios recebidos',d.audios_recebidos,''],['Irritados detectados',d.irritados,'a'],['Carrinhos pela Serena',d.proativas,'']].map(function(x){return '<div class="kb '+x[2]+'"><b>'+esc(x[1]==null?'-':x[1])+'</b><span>'+x[0]+'</span></div>';}).join('')+'</div>';
var mx=Math.max.apply(null,(d.por_dia||[]).map(function(x){return x.conversas;}).concat([1]));
h+='<h4>Conversas por dia</h4>'+(d.por_dia||[]).map(function(x){return '<div class="bar"><span class="d">'+esc(dt(x.dia))+'</span><i style="width:'+Math.round(x.conversas/mx*320)+'px"></i>'+x.conversas+' · Serena '+x.serena+' · humano '+x.humano+'</div>';}).join('');
h+='<h4>Por canal</h4>'+((d.por_canal||[]).map(function(x){return pillCanal(x.canal)+' '+x.n;}).join(' &nbsp; ')||'-');
h+='<h4>Por etiqueta</h4>'+((d.por_etiqueta||[]).map(function(x){return '<span class="tag">'+esc(x.etiqueta)+'</span> '+x.n;}).join(' &nbsp; ')||'-');
h+='<h4>Por atendente (mensagens humanas)</h4>'+((d.por_atendente||[]).map(function(x){return esc(x.autor)+': '+x.n;}).join(' · ')||'-');
if(v.pedidos&&v.pedidos.length){h+='<h4>Pedidos pagos atribuídos à Serena ('+v.n+')</h4>'+v.pedidos.slice(0,40).map(function(o){return '<div class="dis"><div><a href="'+o.admin_url+'" target="_blank">'+esc(o.numero)+'</a> · R$ '+num(o.valor)+'</div><span>'+dt(o.data,1)+'</span></div>';}).join('');}
if(v.erro)h+='<div class="aviso" style="margin-top:10px">'+esc(v.erro)+'</div>';
h+='<div class="dica" style="margin-top:14px">Autonomia = conversas resolvidas sem mensagem humana. Vendas atribuídas = pedidos pagos na Shopify de clientes atendidos pela Serena, entre a primeira resposta e 72h depois da última.</div>';
document.getElementById('mbox').innerHTML=h;}).catch(function(e){document.getElementById('mbox').innerHTML='<h2>Métricas <span class="x" onclick="fecharModal()">fechar</span></h2><div class="empty">Erro: '+esc(e.message)+'</div>';});}

/* init */
var ta=document.getElementById('resp');
ta.addEventListener('keydown',function(e){var aberto=document.getElementById('pop').className.indexOf('on')>=0;if(aberto){var l=filtrarPop(ta.value.slice(1).split(/\s/)[0]);if(e.key==='ArrowDown'){e.preventDefault();popSel=(popSel+1)%Math.max(1,l.length);renderPop(ta.value.slice(1).split(/\s/)[0]);return;}if(e.key==='ArrowUp'){e.preventDefault();popSel=(popSel-1+Math.max(1,l.length))%Math.max(1,l.length);renderPop(ta.value.slice(1).split(/\s/)[0]);return;}if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();if(l[popSel])usarPronta(l[popSel].atalho);return;}if(e.key==='Escape'){fecharPop();return;}}
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarAgente();}});
ta.addEventListener('input',function(){var v=this.value;if(v.charAt(0)==='/'&&v.indexOf(' ')<0&&v.indexOf('\n')<0){renderPop(v.slice(1));}else fecharPop();});
ta.addEventListener('blur',function(){setTimeout(fecharPop,150);});
ta.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px';});
var deb=null;
document.getElementById('busca').addEventListener('input',function(){clearTimeout(deb);deb=setTimeout(carregarConvs,350);});
document.getElementById('canal').addEventListener('change',carregarConvs);document.getElementById('etq').addEventListener('change',carregarConvs);
document.querySelectorAll('#chips button').forEach(function(b){b.addEventListener('click',function(){filtro=b.getAttribute('data-f');document.querySelectorAll('#chips button').forEach(function(x){x.className=x===b?'on':'';});carregarConvs();});});
document.querySelectorAll('#tabs button[data-tab]').forEach(function(b){b.addEventListener('click',function(){setTab(b.getAttribute('data-tab'));});});
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharModal();});
if(PARAMS.get('fila')==='humano'){filtro='humano';document.querySelectorAll('#chips button').forEach(function(x){x.className=x.getAttribute('data-f')==='humano'?'on':'';});}
carregarAgentes();carregarKpis();carregarConvs();
if(PARAMS.get('c'))abrir(PARAMS.get('c'));
setInterval(novas,5000);
setInterval(function(){carregarKpis();if(!document.getElementById('busca').value&&!isMobile())carregarConvs();},20000);
</script></body></html>
