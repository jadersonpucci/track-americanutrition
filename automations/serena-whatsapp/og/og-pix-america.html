<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;src:url(./fonts/bc-900-italic.ttf);font-weight:900;font-style:italic}
@font-face{font-family:BC;src:url(./fonts/bc-800-normal.ttf);font-weight:800;font-style:normal}
@font-face{font-family:B;src:url(./fonts/b-400-normal.ttf);font-weight:400}
@font-face{font-family:B;src:url(./fonts/b-500-normal.ttf);font-weight:500}
@font-face{font-family:B;src:url(./fonts/b-600-normal.ttf);font-weight:600}
@font-face{font-family:B;src:url(./fonts/b-700-normal.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:B,sans-serif;background:#061634 url(./og-checkout-imunofosfo.jpg) 0 0/1200px 630px no-repeat}
.cover{position:absolute;left:0;top:0;width:700px;height:590px;background:linear-gradient(180deg,#0b2158 0%,#08194a 45%,#050f2e 100%);-webkit-mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent 100%)}
.band{position:absolute;left:0;bottom:0;width:1200px;height:42px;background:#050f2b;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:12px;color:#c9d6f2;font-size:19px;font-weight:600;letter-spacing:.2px}
.band .dot{width:7px;height:7px;border-radius:50%;background:#AD0404}
.txt{position:absolute;left:64px;top:46px;width:560px}
.logo{height:64px;width:auto;display:block;margin-bottom:26px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(19,66,44,.9);border:1px solid rgba(80,200,120,.45);color:#7ef29b;border-radius:999px;padding:9px 18px 9px 12px;font-size:20px;font-weight:600}
.pill .led{width:9px;height:9px;border-radius:50%;background:#33d17a;box-shadow:0 0 10px #33d17a}
.ic{width:22px;height:22px}
h1{font-family:BC;font-style:italic;font-weight:900;font-size:86px;line-height:.95;letter-spacing:.5px;color:#fff;margin:22px 0 16px;text-shadow:0 4px 18px rgba(0,0,0,.35)}
h1 span{color:#8cc0ff}
p{color:#e6ecf7;font-size:24px;line-height:1.35;font-weight:400;max-width:540px}
p b{color:#ffd166;font-weight:700}
.btn{display:inline-block;margin:26px 0 24px;background:#d10f0f;background:linear-gradient(180deg,#e01717,#b30909);color:#fff;font-family:BC;font-style:italic;font-weight:900;font-size:36px;letter-spacing:1px;padding:16px 42px;border-radius:12px;box-shadow:0 10px 26px rgba(209,15,15,.45)}
.badges{display:flex;gap:12px}
.badge{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:9px 16px;font-size:20px;font-weight:600}
</style></head><body>
<div class="cover"></div>
<div class="txt">
<img class="logo" src="./logo.png">
<div class="pill"><span class="led"></span><img class="ic" src="./ico/26a1.svg">Pedido reservado · pague em segundos</div>
<h1>PAGUE COM <span>PIX</span></h1>
<p>Falta só <b>um passo</b>: copie o código com um toque ou escaneie o QR Code, e a confirmação é na hora</p>
<div class="btn">PAGAR AGORA ›</div>
<div class="badges"><div class="badge"><img class="ic" src="./ico/1f512.svg">Pagamento seguro</div><div class="badge"><img class="ic" src="./ico/26a1.svg">Confirmação automática</div></div>
</div>
<div class="band">seguro.americanutrition.com <span class="dot"></span> Ciência a favor da sua vida</div>
</body></html>
