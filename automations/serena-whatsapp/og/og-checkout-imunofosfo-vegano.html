<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;src:url(./fonts/barlowcondensed-900-italic.ttf);font-weight:900;font-style:italic}
@font-face{font-family:B;src:url(./fonts/barlow-400-normal.ttf);font-weight:400}
@font-face{font-family:B;src:url(./fonts/barlow-600-normal.ttf);font-weight:600}
@font-face{font-family:B;src:url(./fonts/barlow-700-normal.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:B,sans-serif;background:#030f29 url(./base.jpg) 0 0/1200px 630px no-repeat}
.cobre-esq{position:absolute;left:0;top:118px;width:660px;height:470px;background:linear-gradient(180deg,#030f29 0%,#040d26 60%,#06122c 100%)}
.cobre-dir{position:absolute;left:600px;top:0;width:600px;height:590px;background:radial-gradient(ellipse 340px 300px at 62% 52%,rgba(46,160,90,.30),rgba(10,40,90,.25) 55%,rgba(3,12,32,0) 75%),linear-gradient(90deg,rgba(3,15,41,0) 0,#04112d 70px,#061533 100%)}
.chao{position:absolute;left:700px;top:520px;width:440px;height:60px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(60,220,140,.45),rgba(60,220,140,0) 70%)}
.frasco{position:absolute;left:672px;top:34px;height:540px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.folha{position:absolute;font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.txt{position:absolute;left:64px;top:132px;width:600px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(19,66,44,.9);border:1px solid rgba(80,200,120,.45);color:#7ef29b;border-radius:999px;padding:9px 18px 9px 14px;font-size:20px;font-weight:600}
h1{font-family:BC;font-style:italic;font-weight:900;font-size:88px;line-height:.92;letter-spacing:.5px;color:#fff;margin:20px 0 14px;text-shadow:0 4px 18px rgba(0,0,0,.35)}
h1 span{color:#8cc0ff} h1 em{font-style:italic;color:#4ade80;display:block}
p{color:#e6ecf7;font-size:23px;line-height:1.3;max-width:560px}
p b{color:#ffd166;font-weight:700}
.btn{display:inline-block;margin:22px 0 20px;background:linear-gradient(180deg,#e01717,#b30909);color:#fff;font-family:BC;font-style:italic;font-weight:900;font-size:34px;letter-spacing:1px;padding:14px 40px;border-radius:12px;box-shadow:0 10px 26px rgba(209,15,15,.45)}
.badges{display:flex;gap:12px}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 15px;font-size:19px;font-weight:600}
</style></head><body>
<div class="cobre-esq"></div>
<div class="cobre-dir"></div>
<div class="chao"></div>
<img class="frasco" src="./vegan_cut.png">
<div class="txt">
<div class="pill">🌱 No seu carrinho · cápsula vegetal</div>
<h1>IMUNO<span>FOSFO</span><em>VEGANO</em></h1>
<p>Falta só <b>um passo</b>: finalize agora e receba em casa com rastreio</p>
<div class="btn">PAGAR AGORA ›</div>
<div class="badges"><span class="badge">🔒 Checkout seguro</span><span class="badge">💳 Pix, cartão ou boleto</span></div>
</div>
</body></html>
