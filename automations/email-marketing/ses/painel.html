<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Email · America Nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f6f8fc; --line:#e2e7f0; --grid:#edf0f6;
  --text:#0d1630; --text-2:#46516d; --muted:#7a849b;
  --navy:#0b1a3f; --brand:#07388E; --brand-soft:#e8eefb; --red:#D9121B;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#1a8a4a; --good-bg:#e6f5ec; --warn:#a86b12; --warn-bg:#fff3dd; --bad:#c62828; --bad-bg:#fdeaea;
  --shadow:0 1px 2px rgba(13,22,48,.05),0 4px 16px rgba(13,22,48,.05);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0a0f1d; --surface:#121a2d; --surface-2:#172038; --line:#253050; --grid:#1f2942;
    --text:#eef1f8; --text-2:#b6bfd5; --muted:#8790a8;
    --brand:#6d9cf2; --brand-soft:#1b2747; --red:#ef4b52;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#4cc07b; --good-bg:#12301f; --warn:#e0a947; --warn-bg:#33270f; --bad:#f06262; --bad-bg:#3a1517;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0f1d; --surface:#121a2d; --surface-2:#172038; --line:#253050; --grid:#1f2942;
  --text:#eef1f8; --text-2:#b6bfd5; --muted:#8790a8;
  --brand:#6d9cf2; --brand-soft:#1b2747; --red:#ef4b52;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#4cc07b; --good-bg:#12301f; --warn:#e0a947; --warn-bg:#33270f; --bad:#f06262; --bad-bg:#3a1517;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff}
.hd{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;flex-direction:column;gap:3px;flex:none}
.logo i{display:block;height:4px;background:#D9121B;border-radius:1px}
.logo i:nth-child(1),.logo i:nth-child(2){width:18px;margin-left:6px}.logo i:nth-child(3){width:24px}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.1px}
.brand p{margin:1px 0 0;color:#aeb9d6;font-size:12px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:#cfd7ea;font:600 12.5px Inter,sans-serif;padding:7px 11px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 12px Inter,sans-serif;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#4cc07b;box-shadow:0 0 0 3px rgba(76,192,123,.2)}
.pill .dot.teste{background:#e0a947;box-shadow:0 0 0 3px rgba(224,169,71,.2)}.pill .dot.off{background:#f06262;box-shadow:0 0 0 3px rgba(240,98,98,.2)}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:7px 10px;font:600 12px Inter,sans-serif;cursor:pointer}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:#aeb9d6;font:600 13.5px Inter,sans-serif;padding:11px 14px 13px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#D9121B}
nav.tabs .n{display:inline-block;margin-left:6px;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px}
main.wrap{padding-top:22px;padding-bottom:48px}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:0 0 12px}
.sec-h h2{white-space:nowrap}
.sec-h h2{margin:0;font-size:15px;font-weight:700}
.sec-h p{margin:0;color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.g-hero{grid-template-columns:1.35fr repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hero{background:radial-gradient(120% 140% at 100% 0%,#1d4fb8 0%,#07388E 45%,#0b1a3f 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero .lbl{color:#c7d3f3}
.hero .val{font-size:34px}
.hero .meta{color:#c7d3f3}
.lbl{font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.val{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.hero-row{display:flex;gap:22px;margin-top:14px;position:relative;z-index:1}
.hero-row div{font-size:12px;color:#c7d3f3}.hero-row b{display:block;color:#fff;font-size:16px;margin-top:2px}
.health{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.health>div{padding:16px 18px;border-right:1px solid var(--line)}
.health>div:last-child{border-right:0}
.meter{height:6px;background:var(--grid);border-radius:4px;margin-top:10px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.chip.good{color:var(--good);background:var(--good-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.neutral{color:var(--text-2);background:var(--surface-2)}
.limit{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.limit .meter{flex:1;margin:0}
.chart h3{margin:0;font-size:13.5px;font-weight:700}
.chart .cap{color:var(--muted);font-size:12px;margin:2px 0 10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin:-4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:10px;padding:9px 11px;font-size:12px;z-index:30;display:none;min-width:140px}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:16px}
.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.rank .pos{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;display:grid;place-items:center}
.rank .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
ul.clean{list-style:none;margin:0;padding:0}
.flow{margin-top:22px}
.flow-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.flow-h h3{margin:0;font-size:14px}
.flow-h .chip{font-weight:600}
.emails{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.em{overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.em:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(13,22,48,.12)}
.thumb{position:relative;height:250px;overflow:hidden;background:#f2f4f8;border-bottom:1px solid var(--line)}
.thumb iframe{position:absolute;left:0;top:0;width:600px;height:1100px;border:0;transform:scale(.42);transform-origin:0 0;pointer-events:none;background:#fff}
.thumb .when{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;color:#fff;background:rgba(11,26,63,.85);padding:4px 8px;border-radius:999px}
.em .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.em .subj{font-weight:700;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.em .pre{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.em .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.em .stats div{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.em .stats b{display:block;font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.em.off{opacity:.6}
.modal{position:fixed;inset:0;background:rgba(6,10,22,.6);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:28px 12px;overflow-y:auto}
.modal.on{display:flex}
.mbox{background:var(--surface);border-radius:18px;width:min(720px,100%);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.mhead .from{font-size:12px;color:var(--muted)}
.mhead .s{font-weight:800;font-size:15px;margin-top:2px}
.mhead .p{font-size:12.5px;color:var(--text-2);margin-top:2px}
.mclose{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:6px 10px;cursor:pointer;font-weight:700}
.mstats{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.mframe{background:#eef1f7;padding:14px;display:flex;justify-content:center}
.mframe iframe{width:100%;max-width:640px;height:72vh;border:0;border-radius:10px;background:#fff}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv li:last-child{border-bottom:0}
.kv .k{color:var(--text-2)}
.kv b{font-variant-numeric:tabular-nums}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:14px 0 6px;background:var(--surface)}
.stack span{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--brand);border-radius:4px}
.empty{color:var(--muted);font-size:13px;padding:22px;text-align:center}
.empty b{display:block;color:var(--text-2);font-size:14px;margin-bottom:4px}
.note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.55}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:14px;margin-top:10px}
.load{color:var(--muted);padding:60px 0;text-align:center}
.hide{display:none!important}
@media (max-width:1200px){.g-hero{grid-template-columns:repeat(4,minmax(0,1fr))}.g-hero .hero{grid-column:1/-1}}
@media (max-width:1000px){.g-hero{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hero .hero{grid-column:1/-1}.g-3{grid-template-columns:1fr}.health{grid-template-columns:repeat(2,minmax(0,1fr))}.health>div:nth-child(2){border-right:0}.health>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:700px){.wrap{padding:0 14px}.g-2{grid-template-columns:1fr}.val{font-size:24px}.hero .val{font-size:30px}.hero-row{gap:16px;flex-wrap:wrap}.thumb{height:230px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">
        <div class="logo"><i></i><i></i><i></i></div>
        <div><h1>Email marketing</h1><p id="sub">America Nutrition · Amazon SES</p></div>
      </div>
      <div class="ctrl">
        <div class="seg" role="group" aria-label="Período">
          <button data-d="1">Hoje</button><button data-d="7">7 dias</button><button data-d="30">30 dias</button><button data-d="90">90 dias</button>
        </div>
        <span class="pill" id="modo"><span class="dot"></span>…</span>
        <button class="icon-btn" id="tema" title="Tema claro/escuro">Tema</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="geral">Visão geral</button>
      <button role="tab" data-tab="emails">Emails</button>
      <button role="tab" data-tab="vendas">Vendas</button>
      <button role="tab" data-tab="contatos">Contatos</button>
      <button role="tab" data-tab="operacao">Operação</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><div class="load">Carregando…</div></main>
<div class="tip" id="tip"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox"><div class="mhead"><div><div class="from">De: America Nutrition &lt;contato@americanutrition.com&gt;</div><div class="s" id="mSubj"></div><div class="p" id="mPre"></div></div><button class="mclose" id="mClose">Fechar</button></div><div class="mstats" id="mStats"></div><div class="mframe"><iframe id="mFrame" title="Prévia do email"></iframe></div></div></div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var TOKEN = qs.get('t') || '';
  var BASE = 'https://n8n.americanutrition.com/webhook/';
  var app = document.getElementById('app'), tip = document.getElementById('tip');
  function lg(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function ls(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  var dias = Number(qs.get('dias') || lg('ep_dias') || 30);
  var aba = qs.get('aba') || lg('ep_aba') || 'geral';
  var t0 = lg('ep_tema'); if (t0) document.documentElement.setAttribute('data-theme', t0);

  var fmt = new Intl.NumberFormat('pt-BR');
  var brl = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
  var brl0 = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
  function pct(a,b){ return b ? (a/b*100) : 0; }
  function p1(x, casas){ var m = Math.pow(10, casas == null ? 1 : casas); return (Math.round(x*m)/m).toLocaleString('pt-BR') + '%'; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function dt(s){ if(!s) return '—'; var d = new Date(s); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  function dia(s){ var p = String(s).split('-'); return p[2] + '/' + p[1]; }
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  var FLUXOS = { boas_vindas:['Boas-vindas','Quem se inscreve na lista e ainda não comprou'], carrinho:['Carrinho abandonado','Quem começou o checkout e não pagou: itens, link do carrinho e aviso de cartão recusado'], pos_compra:['Entrega','Começa quando o pedido é entregue: guia de uso de cada produto, complemento certo e avaliação'], recompra:['Recompra','Data calculada pela dose de cada produto, contando do dia seguinte à entrega'], vip:['VIP','Quem chega ao 3º pedido'], navegacao:['Navegação abandonada','Ainda no Klaviyo (precisa do rastreio do site)'] };
  function nomeFluxo(f){ return (FLUXOS[f] || [f])[0]; }

  document.getElementById('tema').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx); ls('ep_tema', nx); if (window.__d) render(window.__d);
  };
  var segs = document.querySelectorAll('.seg button');
  function marcaSeg(){ segs.forEach(function(b){ b.setAttribute('aria-pressed', String(Number(b.dataset.d) === dias)); }); }
  segs.forEach(function(b){ b.onclick = function(){ dias = Number(b.dataset.d); ls('ep_dias', dias); marcaSeg(); carrega(); }; });
  var tabs = document.querySelectorAll('nav.tabs button');
  function marcaTab(){ tabs.forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === aba)); }); }
  tabs.forEach(function(b){ b.onclick = function(){ aba = b.dataset.tab; ls('ep_aba', aba); marcaTab(); if (window.__d) render(window.__d); window.scrollTo({ top:0 }); }; });
  marcaSeg(); marcaTab();

  function carrega(){
    if (!TOKEN) { app.innerHTML = '<div class="err">Link sem token. Abra o painel pelo link completo.</div>'; return; }
    fetch(BASE + 'email-painel-api?t=' + encodeURIComponent(TOKEN) + '&dias=' + dias, { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (!d || d.ok === false) throw new Error('acesso negado'); window.__d = d; render(d); })
      .catch(function(e){ app.innerHTML = '<div class="err">Não consegui carregar os dados (' + esc(e.message) + ').</div>'; });
  }

  function status(v, ok, alerta, invert){ var c = invert ? (v >= ok ? 'good' : (v >= alerta ? 'warn' : 'bad')) : (v <= ok ? 'good' : (v <= alerta ? 'warn' : 'bad')); return c; }
  function chip(c, t){ return '<span class="chip ' + c + '">' + (c === 'good' ? '● ' : (c === 'warn' ? '▲ ' : (c === 'bad' ? '■ ' : ''))) + t + '</span>'; }
  function kpi(l, v, m){ return '<div class="card pad"><div class="lbl">' + l + '</div><div class="val">' + v + '</div><div class="meta">' + (m || '') + '</div></div>'; }
  function vazio(t, s){ return '<div class="card empty"><b>' + t + '</b>' + (s || '') + '</div>'; }
  function sec(t, s, corpo){ return '<section class="sec"><div class="sec-h"><h2>' + t + '</h2>' + (s ? '<p>' + s + '</p>' : '') + '</div>' + corpo + '</section>'; }

  function porModelo(d){ var m = {}; (d.por_modelo || []).forEach(function(x){ m[x.slug] = x; }); return m; }

  function render(d){
    var c = d.config || {}, f = d.fila || {};
    var modo = c.fluxos_modo || '—';
    document.getElementById('modo').innerHTML = '<span class="dot ' + (modo === 'ativo' ? '' : modo) + '"></span>' + (modo === 'ativo' ? 'Enviando' : (modo === 'teste' ? 'Modo teste' : 'Desligado'));
    document.getElementById('sub').textContent = 'Atualizado ' + dt(d.gerado_em) + ' · período desde ' + dia(String(d.desde).slice(0,10));
    var h = ({ geral:geral, emails:emails, vendas:vendas, contatos:contatos, operacao:operacao }[aba] || geral)(d);
    h += '<p class="note">Abertura é uma estimativa: o Mail da Apple abre as imagens sozinho, então parte das aberturas não é leitura real. Cliques e vendas são confiáveis. Venda atribuída: pedido pago até 5 dias depois de um clique num email nosso, ou até 2 dias depois de uma abertura.</p>';
    app.innerHTML = h;
    if (aba === 'geral') graficos(d);
    if (aba === 'emails') ligaEmails(d);
  }

  /* ---------- Visão geral ---------- */
  function geral(d){
    var r = d.resumo || {}, c = d.config || {}, f = d.fila || {};
    var env = r.enviados || 0, ent = r.entregues || 0;
    var ticket = r.vendas ? r.receita / r.vendas : 0;
    var h = '<div class="grid g-hero">';

    var cross = el.querySelector('.cross');
    hover(el, function(i){ var x = M.l + (i + .5) * iw / n; cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible'); var p = pd[i]; return '<b>' + dia(p.dia) + '</b>' + series.map(function(s){ return '<div class="r"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + s[2] + ';margin-right:6px"></span>' + s[1] + '</span><span>' + fmt.format(p[s[0]] || 0) + '</span></div>'; }).join(''); }, function(){ cross.setAttribute('visibility', 'hidden'); });
  }
  function hover(el, html, sai){
    el.querySelectorAll('rect[data-i]').forEach(function(r){
      r.addEventListener('mousemove', function(e){ tip.innerHTML = html(Number(r.dataset.i)); tip.style.display = 'block'; var x = e.clientX + 14; if (x + tip.offsetWidth > innerWidth - 8) x = e.clientX - tip.offsetWidth - 14; tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
      r.addEventListener('mouseleave', function(){ tip.style.display = 'none'; if (sai) sai(); });
      r.addEventListener('touchstart', function(e){ var t = e.touches[0]; tip.innerHTML = html(Number(r.dataset.i)); tip.style.display = 'block'; tip.style.left = Math.min(t.clientX, innerWidth - 170) + 'px'; tip.style.top = (t.clientY + 16) + 'px'; }, { passive:true });
    });
  }

  carrega();
  setInterval(function(){ if (!document.getElementById('modal').classList.contains('on')) carrega(); }, 5 * 60 * 1000);
})();
